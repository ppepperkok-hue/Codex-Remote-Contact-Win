<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1117" />
  <link rel="manifest" href="/app/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/app/icons/icon-192.png" />
  <link rel="stylesheet" href="/app/app.css" />
  <title>CRC Remote</title>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="logo">CRC</div>
        <div>
          <h1>CRC Remote</h1>
          <p id="host-label">连接中…</p>
        </div>
      </div>
      <span class="chip" id="status-chip">…</span>
    </header>

    <div class="section-title">服务</div>
    <div id="services"><div class="skeleton">正在读取服务状态…</div></div>

    <div class="section-title">链接</div>
    <div class="card">
      <div class="row" id="remote-row" style="margin-bottom:10px;display:none">
        <span>外网地址</span>
        <a class="btn ghost small" id="remote-link" target="_blank" rel="noopener">打开</a>
      </div>
      <div class="row">
        <span>QQ 通道</span>
        <span class="muted" id="qq-status">…</span>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/app/app.js"></script>
</body>
</html>
